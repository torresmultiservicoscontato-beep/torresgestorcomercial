name: CI - testes

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://bwoxqsbqbtrkfvrsswrq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Validar diagnóstico e contrato do ambiente
        run: npm run test:environment
      - name: Verificar tipos
        run: npm run typecheck
      - name: Validar configuração segura dos ambientes
        run: node scripts/check-environment.cjs
      - name: Compilar aplicação
        run: npm run build
      - name: Instalar navegador dos testes
        run: npx playwright install --with-deps chromium
      - name: Testes de interface com APIs simuladas
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/torres-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3100/login > /tmp/torres-ci-login.html
          npm run test:ui
      - name: Verificar lint
        run: npm run lint

name: CI - testes

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Verificar lint
        run: npm run lint

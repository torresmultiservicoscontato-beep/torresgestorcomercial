name: CI - testes

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://bwoxqsbqbtrkfvrsswrq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Testes de interface
        run: npm run test:ui
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Validar configuração segura dos ambientes
        run: node scripts/check-environment.cjs
      - name: Compilar aplicação
        run: npm run build

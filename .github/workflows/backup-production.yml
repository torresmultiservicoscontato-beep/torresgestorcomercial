name: Backup criptografado - Produção

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-backup
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_URL: https://sqlrhvxiluzgeldxcmyf.supabase.co
    steps:
      - uses: actions/checkout@v4
      - name: Validar secrets obrigatórios
        shell: bash
        run: |
          test -n "$PROD_DATABASE_URL" || { echo "Falta PROD_DATABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Falta PROD_SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta BACKUP_PASSPHRASE"; exit 1; }
          case "$PROD_DATABASE_URL" in
            *sqlrhvxiluzgeldxcmyf*) ;;
            *) echo "A conexão não parece apontar para produção"; exit 1 ;;
          esac
      - name: Exportar banco PostgreSQL (formato custom)
        run: |
          mkdir -p snapshot/database snapshot/storage
          docker run --rm --network host -e PROD_DATABASE_URL \
            -v "$PWD/snapshot/database:/out" postgres:17 \
            bash -c 'pg_dump --dbname="$PROD_DATABASE_URL" --format=custom --no-owner --no-acl --file=/out/production.dump'
      - name: Exportar documentos Storage
        run: |
          python3 scripts/backup_storage.py "$SUPABASE_URL" vendas-documentos snapshot/storage
      - name: Validar conteúdo mínimo do backup
        run: |
          test -s snapshot/database/production.dump
          python3 -c 'import json; d=json.load(open("snapshot/storage/manifest.json")); assert len(d["files"]) == d["count"]'
          docker run --rm -v "$PWD/snapshot/database:/out" postgres:17 \
            pg_restore --list /out/production.dump > snapshot/database/objects-list.txt
          test -s snapshot/database/objects-list.txt
      - name: Criptografar pacote
        shell: bash
        run: |
          tar -czf - snapshot | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 3 \
            --output backup.enc 3<<<"$BACKUP_PASSPHRASE"
          test -s backup.enc
          sha256sum backup.enc > backup.enc.sha256
          rm -rf snapshot
      - name: Publicar backup exclusivamente criptografado
        uses: actions/upload-artifact@v4
        with:
          name: backup-producao-${{ github.run_id }}
          path: |
            backup.enc
            backup.enc.sha256
          retention-days: 30
          if-no-files-found: error
